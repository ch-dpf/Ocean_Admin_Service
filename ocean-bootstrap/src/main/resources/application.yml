server:
  port: 8090
  address: 0.0.0.0  # 绑定到所有网络接口,允许外部访问
  servlet:
    context-path: /
  compression:
    enabled: true               # 开启GZIP压缩
    mime-types: application/json,application/geo+json,application/vnd.mapbox-vector-tile,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: ocean-admin-service
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 5GB
  # 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ocean_admin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    # HikariCP连接池配置
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis 会话状态（登录并发控制）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_COMMAND_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      client-name: ocean-auth

  # Flyway 迁移配置
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: filesystem:./db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    clean-disabled: true

# 日志配置
logging:
  level:
    root: INFO
    org.ocean.admin: DEBUG
    # 二进制瓦片和完整渲染策略的SQL参数日志会放大I/O与堆分配压力。
    org.ocean.admin.gis.mapper.GisVectorMapper: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ocean.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: true
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Ocean Cloud Service API
  basic:
    enable: false

# 仅列部署、容量与外部进程参数；内部调优项使用代码默认值。
# 需要调优时使用原配置键覆盖，具体分组与示例见 README.md 的“应用配置”。
gis:
  storage:
    root-path: ${GIS_STORAGE_ROOT:gis}
    workspaces:
      # 相对路径统一相对于存储根目录，外部工作空间可填写绝对路径。
      default: ${GIS_STORAGE_WORKSPACE_DEFAULT:workspaces/default}
  upload:
    max-file-size: ${GIS_UPLOAD_MAX_FILE_SIZE:25GB}
    max-batch-size: ${GIS_UPLOAD_MAX_BATCH_SIZE:100GB}
    max-chunk-size: ${GIS_UPLOAD_MAX_CHUNK_SIZE:128MB}
    min-free-space: ${GIS_UPLOAD_MIN_FREE_SPACE:20GB}
  processing:
    # 0 表示不限制影像单任务瓦片数量，正数表示指定上限。
    imagery-max-tile-count: ${GIS_IMAGERY_MAX_TILE_COUNT:0}
    # 构建时与 Maven 的 GDAL 依赖版本保持一致。
    gdal-version: '@gdal.version@'
    gdal-worker-max-heap: ${GIS_GDAL_WORKER_MAX_HEAP:1g}
    gdal-native-library-path: ${GIS_GDAL_NATIVE_LIBRARY_PATH:}
    gdal-process-timeout: ${GIS_GDAL_PROCESS_TIMEOUT:30m}
  publication:
    # 对外返回的服务地址；经反向代理部署时配置为浏览器可访问的域名。
    public-base-url: ${GIS_PUBLIC_BASE_URL:http://192.168.14.65:8090}
  terrain:
    mago:
      enabled: ${GIS_TERRAIN_MAGO_ENABLED:true}
      # 切片与主服务共用 JVM，缓存预算不代表任务的堆内存硬上限。
      task-timeout: 72h
      max-concurrent-tasks: 1
      raster-cache-bytes: 268435456

ocean:
  audit:
    ip-location:
      # ip2region 离线库由部署环境独立维护；未配置时公网地址降级为“未知”。
      ipv4-xdb-path: ${IP2REGION_V4_XDB_PATH:}
      ipv6-xdb-path: ${IP2REGION_V6_XDB_PATH:}
