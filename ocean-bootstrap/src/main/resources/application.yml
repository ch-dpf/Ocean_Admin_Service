server:
  port: 8090
  address: 0.0.0.0  # 绑定到所有网络接口,允许外部访问
  servlet:
    context-path: /
  compression:
    enabled: true               # 开启GZIP压缩
    mime-types: application/json,application/xml,text/html,text/xml,text/plain  # 压缩JSON等类型
    min-response-size: 1024

spring:
  application:
    name: ocean-admin-service
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 5GB
  # 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ocean_admin}
    username: ${DB_USERNAME:ocean_admin}
    password: ${DB_PASSWORD:ocean_admin}
    # HikariCP连接池配置
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis 会话状态（登录并发控制）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DB:0}
      timeout: 3s

  # Flyway 迁移配置
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    clean-disabled: true

gis:
  upload:
    base-path: ${GIS_UPLOAD_BASE_PATH:uploads/gis}

# 日志配置
logging:
  level:
    root: INFO
    org.ocean.admin: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ocean.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: true
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Ocean Cloud Service API
  basic:
    enable: false
