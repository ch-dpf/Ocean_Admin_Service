spring:
  application:
    name: ocean-admin-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ocean_admin}
    username: ${DB_USERNAME:ocean_admin}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ocean:
  security:
    authorization-server:
      issuer: ${OAUTH2_ISSUER:http://localhost:${SERVER_PORT:8080}}
      audience: ${OAUTH2_AUDIENCE:ocean-admin-api}
      key-id: ${OAUTH2_KEY_ID:ocean-admin-signing}
      key-store: ${OAUTH2_KEYSTORE_LOCATION}
      key-store-type: ${OAUTH2_KEYSTORE_TYPE:PKCS12}
      key-alias: ${OAUTH2_KEY_ALIAS:ocean-admin}
      key-store-password: ${OAUTH2_KEYSTORE_PASSWORD}
