spring:
  application:
    name: ocean-admin-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ocean_admin}
    username: ${DB_USERNAME:ocean_admin}
    password: ${DB_PASSWORD:ocean_admin}
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  type-handlers-package: org.ocean.admin.platform.identity.dao.type
  configuration:
    map-underscore-to-camel-case: true

ocean:
  bootstrap:
    admin:
      enabled: ${OCEAN_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${OCEAN_BOOTSTRAP_ADMIN_USERNAME:admin}
    oauth-client:
      enabled: ${OCEAN_BOOTSTRAP_OAUTH_CLIENT_ENABLED:false}
      client-id: ${OCEAN_BOOTSTRAP_OAUTH_CLIENT_ID:ocean-admin-web}
      client-name: ${OCEAN_BOOTSTRAP_OAUTH_CLIENT_NAME:Ocean Admin Web}
      platform-code: ${OCEAN_BOOTSTRAP_OAUTH_PLATFORM_CODE:OCEAN_ADMIN}
      redirect-uri: ${OCEAN_BOOTSTRAP_OAUTH_REDIRECT_URI:http://127.0.0.1:3000/login/oauth2/code/ocean-admin}
      post-logout-redirect-uri: ${OCEAN_BOOTSTRAP_OAUTH_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:3000/}
      require-consent: ${OCEAN_BOOTSTRAP_OAUTH_REQUIRE_CONSENT:true}
  security:
    session:
      maximum-lifetime: ${OCEAN_SESSION_MAXIMUM_LIFETIME:P30D}
    session-cache:
      enabled: ${OCEAN_SESSION_CACHE_ENABLED:true}
      key-prefix: ${OCEAN_SESSION_CACHE_KEY_PREFIX:ocean:iam:session:}
      maximum-ttl: ${OCEAN_SESSION_CACHE_MAXIMUM_TTL:PT5M}
    authorization-server:
      issuer: ${OAUTH2_ISSUER:http://localhost:${SERVER_PORT:8090}}
      audience: ${OAUTH2_AUDIENCE:ocean-admin-api}
