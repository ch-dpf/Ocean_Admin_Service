name: ocean-admin

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocean_admin}
      POSTGRES_USER: ${DB_USERNAME:-ocean_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/application.env}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - "${OCEAN_HOME:-.}/data/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/application.env}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6381}:6379"
    volumes:
      - "${OCEAN_HOME:-.}/data/redis:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ocean-admin-service:${OCEAN_ADMIN_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ocean_admin}
      DB_USERNAME: ${DB_USERNAME:-ocean_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/application.env}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/application.env}
      REDIS_DB: ${REDIS_DB:-0}
      GIS_UPLOAD_BASE_PATH: /app/data/uploads
      GIS_PROCESSING_BASE_PATH: /app/data/processing
      GIS_PROCESSING_WORKSPACE_DEFAULT: /app/data/workspaces/default
      GIS_IMAGERY_CACHE_PATH: /app/data/imagery/cache
      GIS_PUBLIC_BASE_URL: ${GIS_PUBLIC_BASE_URL:-http://127.0.0.1:8090}
      GIS_TERRAIN_MAGO_ENABLED: ${GIS_TERRAIN_MAGO_ENABLED:-true}
      GIS_TERRAIN_MAGO_JAR_PATH: /app/runtime/mago/mago-3d-terrainer-1.14.2-release.jar
      GIS_TERRAIN_MAGO_MAX_HEAP: ${GIS_TERRAIN_MAGO_MAX_HEAP:-8g}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:8090"
    volumes:
      - "${OCEAN_HOME:-.}/data/app:/app/data"
      - "${OCEAN_HOME:-.}/logs:/app/logs"

